<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXOS</title><link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-ui);color:var(--ink);background:#fff}
a,a:hover{color:var(--blue)}tr:hover td{background:var(--row-hover)}
.ev-link{transition:transform .12s,box-shadow .12s}.ev-link:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(28,35,64,.10)}
@media(max-width:640px){.ev-grid{grid-template-columns:1fr!important}}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,38%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.strip-item{scroll-snap-align:start}
.strip::-webkit-scrollbar{height:6px}.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.zoomable{transition:filter .12s}.zoomable:hover{filter:brightness(1.06)}
.lb-root{animation:swFade .18s ease}.lb-img{animation:swIn .24s cubic-bezier(.2,.7,.3,1) both}
.strip-nav{background:#fff;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;font-size:14px;color:var(--ink);cursor:pointer}
.strip-nav:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:640px){.strip{grid-auto-columns:minmax(240px,84%)}}
.opener{transition:transform .12s,box-shadow .12s}.opener:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(28,35,64,.10)}
@keyframes swIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes swFade{from{opacity:0}to{opacity:1}}
.sw-scrim{animation:swFade .18s ease}.sw-panel{animation:swIn .26s cubic-bezier(.2,.7,.3,1) both}
.sp-root{animation:spIn .3s cubic-bezier(.2,.7,.3,1) both}@keyframes spIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(max-width:980px){.sw-body{grid-template-columns:1fr!important}.sw-body aside{border-left:none!important;border-top:1px solid var(--line)}}
@media(max-width:1030px){.navlinks{display:none!important}.menubtn{display:block!important}}
@media(max-width:640px){.cta-row{grid-template-columns:1fr!important}.mobile-cta{display:block!important}}</style>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#fdfcfa"/></svg></template>
</head><body><div id="root"></div>
<script src="image-slot.js"></script>
<script src="_ds_bundle.js"></script>
<script src="data-source.js"></script>
<script src="content.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="SectionWindowExport.jsx"></script>
<script type="text/babel" src="SectionPageExport.jsx"></script>
<script type="text/babel" src="LightboxExport.jsx"></script>
<script type="text/babel" src="EditorialLandingExport.jsx"></script>
<script type="text/babel">
const nexosRoot = ReactDOM.createRoot(document.getElementById('root'));
window.__nexosRender = function(){ nexosRoot.render(<EditorialLandingExport key={Date.now()}/>); };
window.__nexosRender();
</script>
</body></html>
